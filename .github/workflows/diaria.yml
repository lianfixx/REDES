name: Actualización diaria

# Cada día a las 06:47 (centro de México): lee el red/estado.json de cada skill, valida todo y regenera
# TABLERO.md y panel/datos.json. Si algo no valida, el tablero lo muestra en «Avisos» y este trabajo falla en rojo.
on:
  schedule:
    - cron: "47 12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["ideas/**", "decisiones/**", "calendario/**", "registro/**", "lecciones/**", "experimentos/**", "skills/matriz-redes/data/**"]

permissions:
  contents: write

concurrency:
  group: diaria
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Regenerar tablero
        run: python3 skills/matriz-redes/scripts/redes.py tablero --leer-skills --hoy "$(TZ=America/Mexico_City date +%F)"
      - name: Guardar si cambió
        run: |
          if git diff --quiet -- TABLERO.md panel/datos.json; then echo "Sin cambios."; exit 0; fi
          git config user.name "Matriz de Redes (automático)"
          git config user.email "actions@users.noreply.github.com"
          git add TABLERO.md panel/datos.json
          git commit -m "Tablero: actualización diaria" -m "IA-Actor: GitHub Actions (actualización diaria)"
          git push
      - name: Validar
        run: python3 skills/matriz-redes/scripts/redes.py validar
